name: Proximus Cybersecurity Content Crawler

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 1 * *'

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1
      
      - name: Set up Python
        uses: actions/setup-python@v5.1
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml
      
      - name: Run crawler
        run: python proximus_crawler.py
      
      - name: Check for changes
        id: verify
        run: |
          if [ -f proximus_cybersecurity_audit_*.csv ]; then
            echo "has_results=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit and push results
        if: steps.verify.outputs.has_results == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add proximus_cybersecurity_audit_*.csv
          git commit -m "Update Proximus cybersecurity audit - $(date +'%Y-%m-%d')"
          git push
