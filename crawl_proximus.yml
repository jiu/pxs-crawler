name: Proximus Cybersecurity Content Crawler

# Trigger: Manual (on-demand) + Scheduled (monthly)
on:
  workflow_dispatch:  # Allow manual trigger from GitHub UI
  schedule:
    - cron: '0 2 1 * *'  # Run on 1st of each month at 2:00 AM UTC

jobs:
  crawl:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml
      
      - name: Run crawler
        run: python proximus_crawler.py
      
      - name: Commit and push results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add proximus_cybersecurity_audit_*.csv
          git commit -m "Update Proximus cybersecurity audit - $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push
      
      - name: Create summary
        run: |
          echo "## Proximus Crawler Report" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ✅ Completed" >> $GITHUB_STEP_SUMMARY
          echo "- **Time**: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact**: proximus_cybersecurity_audit_*.csv" >> $GITHUB_STEP_SUMMARY
